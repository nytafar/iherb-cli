[package]
name = "iherb-cli"
version = "0.1.1"
edition = "2021"
description = "CLI tool for querying iHerb product data"
repository = "https://github.com/nytafar/iherb-cli"

[lib]
name = "iherb_cli"
path = "src/lib.rs"

[[bin]]
name = "iherb-cli"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Browser automation
# 0.9 dropped the `tokio-runtime` feature: tokio is now the only runtime and is
# unconditional. `default-features = false` still turns off `bytes`, matching the
# feature set we had under 0.7.
chromiumoxide = { version = "0.9.1", default-features = false }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# HTML parsing
scraper = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dates
#
# Already in the tree as a transitive dependency of `zip`; naming it here adds
# the `formatting` feature and nothing else. It replaces the hand-rolled civil-
# date arithmetic `output.rs` used to carry — an epoch-day loop, a leap-year
# rule and a month table — for two formatted strings (#7). `chrono` is the
# other obvious candidate and is *not* in the tree, so it would be a new
# dependency; this one is not.
time = { version = "0.3", features = ["formatting"] }

# Utilities
dirs = "6"
sha2 = "0.10"
hex = "0.4"
zip = "2"
url = "2"
regex = "1"

# Ctrl+C handling
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
# Fixtures under tests/fixtures/ are stored gzipped; the loader inflates them.
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
